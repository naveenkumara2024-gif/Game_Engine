[package]
name = "ge_engine"
description = "Engine loop: startup phases, tick, cooperative exit. Games never write their own loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["hot-reload"]
tracy = ["ge_core/tracy", "ge_rhi/tracy", "ge_ecs/trace"]
# Shader hot reload (dev). `shipping` will turn this off (M10).
hot-reload = ["ge_render/hot-reload"]

[dependencies]
ge_core.workspace = true
ge_platform.workspace = true
ge_rhi.workspace = true
ge_shader.workspace = true
ge_render.workspace = true
ge_ecs.workspace = true
tracing.workspace = true
thiserror.workspace = true

[lints]
workspace = true
