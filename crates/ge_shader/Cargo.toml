[package]
name = "ge_shader"
description = "Shader library: WESL -> WGSL compilation, permutations (@if features), hot reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["hot-reload"]
# Watch the shader folder and report edits (dev only; shipping cooks shaders at M10).
hot-reload = ["dep:notify"]

[dependencies]
ge_core.workspace = true
wesl.workspace = true
notify = { workspace = true, optional = true }
tracing.workspace = true
thiserror.workspace = true

[lints]
workspace = true
